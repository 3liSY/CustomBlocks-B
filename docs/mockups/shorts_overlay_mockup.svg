<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#172131"/>
      <stop offset="1" stop-color="#101218"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#78b9eb"/>
      <stop offset=".52" stop-color="#7ab562"/>
      <stop offset="1" stop-color="#6c9c50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <pattern id="blocks" width="52" height="52" patternUnits="userSpaceOnUse">
      <rect width="52" height="52" fill="#6fa450"/>
      <rect width="26" height="26" fill="#7db25a" opacity=".7"/>
      <path d="M0 51.5H52M51.5 0V52" stroke="#000" stroke-opacity=".18"/>
    </pattern>
    <style>
      .title { font: 800 44px Segoe UI, Arial, sans-serif; fill: #eef2ff; }
      .sub { font: 400 18px Segoe UI, Arial, sans-serif; fill: #aab2c5; }
      .head { font: 800 18px Segoe UI, Arial, sans-serif; fill: #eef2ff; }
      .muted { font: 400 15px Segoe UI, Arial, sans-serif; fill: #aab2c5; }
      .small { font: 700 14px Segoe UI, Arial, sans-serif; fill: #101218; }
      .key { font: 900 30px Segoe UI, Arial, sans-serif; fill: #f5c84c; }
      .keyText { font: 500 16px Segoe UI, Arial, sans-serif; fill: #c7cede; }
      .badge { font: 800 14px Segoe UI, Arial, sans-serif; fill: #bff7d4; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#page)"/>
  <text class="title" x="50" y="68">Shorts Overlay Mockup</text>
  <text class="sub" x="52" y="102">You see the guides while playing. OBS records clean Minecraft footage with no overlay lines.</text>
  <rect x="1092" y="44" width="250" height="40" rx="8" fill="#123321" stroke="#54e38e" stroke-opacity=".45"/>
  <text class="badge" x="1114" y="69">OBS output stays clean</text>

  <g filter="url(#shadow)">
    <rect x="50" y="145" width="860" height="590" rx="10" fill="#191c24" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="50" y="145" width="860" height="52" rx="10" fill="#11141c"/>
    <text class="head" x="72" y="178">What you see on your monitor</text>
    <text class="muted" x="440" y="178">visible to your eyes, click-through while you play</text>

    <g transform="translate(72 218)">
      <rect width="816" height="459" fill="url(#sky)"/>
      <path d="M0 190 L120 80 L250 190 Z M170 190 L330 48 L520 190 Z M450 190 L620 75 L816 190 Z" fill="#405660" opacity=".75"/>
      <rect y="275" width="816" height="184" fill="url(#blocks)"/>
      <rect x="110" y="68" width="100" height="32" rx="6" fill="#fff" opacity=".82"/>
      <rect x="150" y="48" width="78" height="32" rx="6" fill="#fff" opacity=".72"/>
      <rect x="610" y="58" width="120" height="32" rx="6" fill="#fff" opacity=".78"/>

      <g transform="translate(388 174)">
        <rect x="9" y="0" width="44" height="44" fill="#d59a69" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
        <rect x="3" y="44" width="56" height="74" fill="#3d86d9" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
        <rect x="6" y="118" width="21" height="55" fill="#2f466e" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
        <rect x="35" y="118" width="21" height="55" fill="#2f466e" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
      </g>

      <g transform="translate(260 405)">
        <rect width="296" height="34" fill="#111" opacity=".5"/>
        <g>
          <rect x="4" y="3" width="28" height="28" fill="#f5c84c" opacity=".45" stroke="#fff" stroke-width="2"/>
          <rect x="36" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <rect x="68" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <rect x="100" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <rect x="132" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <rect x="164" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <rect x="196" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <rect x="228" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <rect x="260" y="3" width="28" height="28" fill="#1a1a1a" opacity=".75" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
        </g>
      </g>

      <rect x="0" y="0" width="178.5" height="459" fill="#000" opacity=".58"/>
      <rect x="637.5" y="0" width="178.5" height="459" fill="#000" opacity=".58"/>
      <rect x="178.5" y="0" width="459" height="459" fill="none" stroke="#f5c84c" stroke-width="5"/>
      <rect x="224" y="36" width="368" height="386" fill="none" stroke="#57d7ff" stroke-width="3" stroke-dasharray="12 9"/>
      <rect x="342" y="82" width="132" height="294" fill="#54e38e" opacity=".07" stroke="#54e38e" stroke-width="3"/>
      <rect x="284" y="342" width="248" height="70" fill="#ff6b6b" opacity=".08" stroke="#ff6b6b" stroke-width="5"/>
      <rect x="312" y="316" width="192" height="28" rx="5" fill="#ff6b6b"/>
      <text class="small" x="329" y="336" fill="#fff">CAPTIONS - KEEP CLEAR</text>
      <rect x="340" y="10" width="136" height="28" rx="5" fill="#f5c84c"/>
      <text class="small" x="354" y="30">9:16 SHORTS CROP</text>
    </g>

    <g transform="translate(72 696)">
      <rect width="250" height="74" rx="8" fill="#222734" stroke="#fff" stroke-opacity=".16"/>
      <text class="key" x="18" y="45">F8</text>
      <text class="keyText" x="78" y="34">show / hide</text>
      <text class="keyText" x="78" y="56">the guide instantly</text>
      <rect x="283" width="250" height="74" rx="8" fill="#222734" stroke="#fff" stroke-opacity=".16"/>
      <text class="key" x="301" y="45">F9</text>
      <text class="keyText" x="361" y="34">borderless path</text>
      <text class="keyText" x="361" y="56">for full overlay</text>
      <rect x="566" width="250" height="74" rx="8" fill="#222734" stroke="#fff" stroke-opacity=".16"/>
      <text class="key" x="584" y="45">F11</text>
      <text class="keyText" x="652" y="34">exclusive fallback</text>
      <text class="keyText" x="652" y="56">side marks only</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="145" width="410" height="265" rx="10" fill="#191c24" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="940" y="145" width="410" height="52" rx="10" fill="#11141c"/>
    <text class="head" x="962" y="178">What OBS records</text>
    <text class="muted" x="1172" y="178">no guide lines</text>
    <g transform="translate(962 218) scale(.4485)">
      <rect width="816" height="459" fill="url(#sky)"/>
      <path d="M0 190 L120 80 L250 190 Z M170 190 L330 48 L520 190 Z M450 190 L620 75 L816 190 Z" fill="#405660" opacity=".75"/>
      <rect y="275" width="816" height="184" fill="url(#blocks)"/>
      <g transform="translate(388 174)">
        <rect x="9" y="0" width="44" height="44" fill="#d59a69" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
        <rect x="3" y="44" width="56" height="74" fill="#3d86d9" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
        <rect x="6" y="118" width="21" height="55" fill="#2f466e" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
        <rect x="35" y="118" width="21" height="55" fill="#2f466e" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
      </g>
    </g>
    <rect x="955" y="230" width="130" height="30" rx="6" fill="#0b2518" stroke="#54e38e" stroke-opacity=".45"/>
    <text class="badge" x="969" y="250">overlay excluded</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="434" width="410" height="392" rx="10" fill="#191c24" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="940" y="434" width="410" height="52" rx="10" fill="#11141c"/>
    <text class="head" x="962" y="467">Final short crop</text>
    <text class="muted" x="1132" y="467">middle 9:16 kept</text>
    <g transform="translate(1070 505)">
      <clipPath id="shortClip"><rect width="162" height="288" rx="8"/></clipPath>
      <rect width="162" height="288" rx="8" fill="#000" stroke="#fff" stroke-opacity=".24" stroke-width="4"/>
      <g clip-path="url(#shortClip)" transform="translate(-248 0) scale(.627)">
        <rect width="816" height="459" fill="url(#sky)"/>
        <path d="M0 190 L120 80 L250 190 Z M170 190 L330 48 L520 190 Z M450 190 L620 75 L816 190 Z" fill="#405660" opacity=".75"/>
        <rect y="275" width="816" height="184" fill="url(#blocks)"/>
        <g transform="translate(388 174)">
          <rect x="9" y="0" width="44" height="44" fill="#d59a69" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
          <rect x="3" y="44" width="56" height="74" fill="#3d86d9" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
          <rect x="6" y="118" width="21" height="55" fill="#2f466e" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
          <rect x="35" y="118" width="21" height="55" fill="#2f466e" stroke="#000" stroke-opacity=".24" stroke-width="3"/>
        </g>
      </g>
      <rect x="22" y="204" width="118" height="42" rx="6" fill="#000" opacity=".72"/>
      <text x="42" y="230" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="16" fill="#fff">captions</text>
    </g>
  </g>

  <g transform="translate(50 800)">
    <rect width="410" height="58" rx="9" fill="#191c24" stroke="#ffffff" stroke-opacity=".16"/>
    <text class="head" x="18" y="25">Recommended use</text>
    <text class="muted" x="18" y="47">Press F9 for borderless, then F8 to show the guide. Tap F8 again to hide it.</text>
    <rect x="485" width="430" height="58" rx="9" fill="#191c24" stroke="#ffffff" stroke-opacity=".16"/>
    <text class="head" x="503" y="25">Capture promise</text>
    <text class="muted" x="503" y="47">Visible to you. Hidden from OBS/screenshot only after real-world confirmation.</text>
    <rect x="940" width="410" height="58" rx="9" fill="#191c24" stroke="#ffffff" stroke-opacity=".16"/>
    <text class="head" x="958" y="25">Design pass</text>
    <text class="muted" x="958" y="47">We can make it calmer, bolder, simpler, or more creator-dashboard-like.</text>
  </g>
</svg>
