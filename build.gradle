// =============================================================================
//  CustomBlocks — build.gradle
//
//  Fabric mod for Minecraft 1.21.1 (see CustomBlocks_Engineering_Bible.md).
//
//  PHASING NOTE (per Engineering Bible §7 "start minimal, expand per-phase"):
//  This build script only declares what the CURRENT phase needs. Dependencies
//  and tasks are added when their feature is built — NOT all up front.
//    • Phase 0  (now)  → loom, fabric-api, UTF-8, mojibakeShield, soundGate
//    • Phase 13        → jcodec (video-to-texture)
//    • Phase 15        → SpotBugs static analysis (strict mode)
//    • when needed     → fabric-permissions-api (permissions are post-v1.0)
// =============================================================================

plugins {
    id 'fabric-loom' version '1.7.4'
}

version = '1.0.0'
group = 'com.customblocks'

base {
    archivesName = 'customblocks'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings  "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.104.0+1.21.1"
    include           "net.fabricmc.fabric-api:fabric-api:0.104.0+1.21.1"

    // Phase 13 — jcodec (pure-Java MP4/H264 decoder for video-to-texture)
    include implementation("org.jcodec:jcodec:0.2.5")
    include implementation("org.jcodec:jcodec-javase:0.2.5")

    // Group 14 — TwelveMonkeys WebP ImageIO plugin (pure Java, no native code). Adds WebP read
    // support to ImageIO so /cb create accepts .webp (static, and animated where the plugin exposes
    // frames). Transitive TwelveMonkeys artifacts are listed explicitly so `include` JiJ's them all
    // (Loom's include does not pull transitives), or the reader would ClassNotFound at runtime.
    include implementation("com.twelvemonkeys.imageio:imageio-webp:3.12.0")
    include implementation("com.twelvemonkeys.imageio:imageio-core:3.12.0")
    include implementation("com.twelvemonkeys.common:common-lang:3.12.0")
    include implementation("com.twelvemonkeys.common:common-io:3.12.0")
    include implementation("com.twelvemonkeys.common:common-image:3.12.0")

    // Group 29 - Windows capture-invisible Shorts overlay.
    // JNA calls user32.dll for click-through and WDA_EXCLUDEFROMCAPTURE.
    include implementation("net.java.dev.jna:jna:5.14.0")
    include implementation("net.java.dev.jna:jna-platform:5.14.0")

    // Phase 16 — Mod Menu config screen integration (compile-only; not shipped)
    modCompileOnlyApi "com.terraformersmc:modmenu:11.0.2"

    // Post-v1.0 — Fabric Permissions API
    // modImplementation("me.lucko:fabric-permissions-api:0.3.1") { transitive = false }
    //
    // Phase 15 — SpotBugs annotations (compileOnly — not shipped in the mod JAR)
    // compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
}

processResources {
    filteringCharset "UTF-8"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// All verification gates live in verify.gradle (split out for clarity).
apply from: 'verify.gradle'

tasks.named('build').configure {
    dependsOn tasks.named('mojibakeShield')
    dependsOn tasks.named('soundGate')
    dependsOn tasks.named('monolithGate')
    dependsOn tasks.named('tgGate')
    // G04-3 chat gates — WIRED 2026-07-14. All legacy violations are cleaned: 82 raw sends now route
    // through Chat, and 850 hand-picked §-codes are named meanings in CbFmt. Wired as dependsOn so
    // the drift cannot come back — a new handler that bypasses Chat, or hardcodes a colour, fails
    // the build the first time it is compiled.
    dependsOn tasks.named('chatRouteGate')
    dependsOn tasks.named('chatColourGate')
    // G04 §F — hotbar unification. Colour is chosen by the Chat method (green/red/white + yellow value),
    // never jammed into the body by the caller. Wired as a HARD gate (owner-locked 2026-07-15): a raw
    // hotbar send outside Chat, or a § / CbFmt colour in a hotbar body, fails the build. Hotbar-only —
    // it does not touch client HUD/overlay rendering.
    dependsOn tasks.named('hotbarRouteGate')
    // G04-2 — a command with no help entry is invisible to /cb help AND to "did you mean".
    // 67 of 119 had drifted into that state; this stops it recurring.
    dependsOn tasks.named('helpCoverageGate')
    finalizedBy tasks.named('staleTodoGate')
}
